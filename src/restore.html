<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Restore Ghost AI</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    button {
      width: 100%; height: 100%; padding: 0; cursor: pointer;
      border-radius: 50%; border: 1px solid rgba(255,255,255,0.18);
      background: rgba(9,9,14,0.72); color: #7DF9AA;
      display: flex; align-items: center; justify-content: center;
      opacity: 0.55; transition: opacity 0.15s, transform 0.15s;
    }
    button:hover { opacity: 1; transform: scale(1.06); }
    svg { width: 20px; height: 20px; }
  </style>
</head>
<body>
  <button id="restore" title="Restore Ghost AI">
    <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
      <path d="M9 17c0-5 3-9 7-9s7 4 7 9v5c0 1-1 2-2 2h-1.6l-1.8-2-1.8 2h-1.6l-1.8-2-1.8 2H11c-1 0-2-1-2-2v-5z"/>
      <circle cx="13" cy="16" r="1.4" fill="#09090e"/>
      <circle cx="19" cy="16" r="1.4" fill="#09090e"/>
    </svg>
  </button>
  <script>
    document.getElementById('restore').addEventListener('click', () => window.ghostAI.showWindow());
  </script>
</body>
</html>
